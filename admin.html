<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolicyMitra Admin Leads</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#09295b;color:#fff;padding:18px}main{max-width:1100px;margin:25px auto;padding:0 15px}.box{background:#fff;padding:20px;border-radius:14px;box-shadow:0 6px 20px #0001}input,button{padding:11px;border-radius:8px;border:1px solid #ccd5e2}button{cursor:pointer;font-weight:700}.primary{background:#1769d2;color:#fff;border:0}table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e4e8ef;text-align:left}th{background:#f0f4fa}.scroll{overflow:auto}.msg{margin-top:10px}</style></head><body><header><b>PolicyMitra — Lead Dashboard</b></header><main><div class="box"><p>Enter the Admin Token configured on your hosting.</p><input id="token" type="password" placeholder="Admin token" style="width:70%"> <button class="primary" onclick="load()">Load Leads</button> <button onclick="csv()">Export CSV</button><div id="msg" class="msg"></div><div class="scroll"><table><thead><tr><th>Date</th><th>Name</th><th>Mobile</th><th>Age</th><th>City</th><th>Income</th><th>Requirement</th><th>Message</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const tok=()=>document.getElementById('token').value;async function load(){const r=await fetch('/api/leads',{headers:{Authorization:'Bearer '+tok()}});if(!r.ok){document.getElementById('msg').textContent='Unauthorized or server error';return}const a=await r.json();document.getElementById('rows').innerHTML=a.slice().reverse().map(x=>`<tr><td>${new Date(x.submittedAt).toLocaleString()}</td><td>${esc(x.name)}</td><td><a href="tel:${esc(x.mobile)}">${esc(x.mobile)}</a></td><td>${esc(x.age)}</td><td>${esc(x.city)}</td><td>${esc(x.income)}</td><td>${esc(x.requirement)}</td><td>${esc(x.message)}</td></tr>`).join('');document.getElementById('msg').textContent=a.length+' lead(s)';}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function csv(){const r=await fetch('/api/leads.csv',{headers:{Authorization:'Bearer '+tok()}});if(!r.ok){alert('Load leads first with a valid token.');return}const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='policymitra-leads.csv';a.click()}</script></body></html>
